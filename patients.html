<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patients — Dharati's HMS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-inner">
    <a class="nav-brand" href="index.html">
      <div class="nav-logo">🏥</div>
      <div>
        <div class="nav-title">Dharti's HMS</div>
        <div class="nav-subtitle">Physiotherapy Clinic</div>
      </div>
    </a>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="patients.html" class="active">Patients</a>
      <a href="doctors.html">Doctors</a>
      <a href="appointments.html">Appointments</a>
      <a href="contact.html">Contact</a>
    </div>
    <button class="nav-hamburger" id="hamburger">☰</button>
  </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="page-header-inner">
    <div>
      <h1>👥 Patient Management</h1>
      <p>View, add, edit and manage all patients</p>
    </div>
    <button class="btn btn-primary" onclick="openAddPatient()">➕ Add Patient</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<section class="section">
  <div class="container">

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-number" id="patient-count">—</div>
        <div class="stat-label">Total Patients</div>
      </div>
    </div>

    <!-- SEARCH + TABLE -->
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:1rem;">
      <h2 style="font-family:var(--font-display);color:var(--primary);font-size:1.2rem;">All Patients</h2>
      <div class="search-bar">
        <input id="search-input" class="form-control" type="text" placeholder="Search name, phone, condition…" oninput="loadPatients(this.value)" />
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#ID</th>
            <th>Full Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Phone</th>
            <th>Condition</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="patients-tbody">
          <tr class="loading-row"><td colspan="7"><span class="spinner spinner-dark"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</section>

<!-- ADD / EDIT PATIENT MODAL -->
<div class="modal-overlay" id="patient-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="patient-modal-title">Add New Patient</h3>
      <button class="modal-close" onclick="closeModal('patient-modal')">✕</button>
    </div>
    <div class="modal-body">
      <form id="patient-form" onsubmit="event.preventDefault(); savePatient();">
        <input type="hidden" id="patient-id-hidden" />
        <div class="form-grid">
          <div class="form-group form-full">
            <label class="form-label">Full Name *</label>
            <input id="p-name" class="form-control" type="text" placeholder="Patient's full name" required />
          </div>
          <div class="form-group">
            <label class="form-label">Age *</label>
            <input id="p-age" class="form-control" type="number" min="1" max="120" placeholder="Age" required />
          </div>
          <div class="form-group">
            <label class="form-label">Gender *</label>
            <select id="p-gender" class="form-control" required>
              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number *</label>
            <input id="p-phone" class="form-control" type="tel" placeholder="+91 XXXXXXXXXX" required />
          </div>
          <div class="form-group form-full">
            <label class="form-label">Address</label>
            <input id="p-address" class="form-control" type="text" placeholder="Patient's address" />
          </div>
          <div class="form-group form-full">
            <label class="form-label">Medical Condition / Chief Complaint</label>
            <textarea id="p-condition" class="form-control" placeholder="Describe the medical condition or chief complaint…"></textarea>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn" style="background:var(--border);color:var(--text);" onclick="closeModal('patient-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="savePatient()">💾 Save Patient</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>loadPatients();</script>
</body>
</html>
